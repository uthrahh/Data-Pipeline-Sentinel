command:
  - "sh"
  - "-c"
  - "npm run build && npm run start -- -p 8000"

# Everything in this app is static demo data except Genie, which POSTs to the
# ai-dataops-assistant /api/chat endpoint through this app's own server-side
# proxy (src/app/api/proxy). No Databricks credential ever reaches the browser.
env:
  - name: "NEXT_PUBLIC_API_URL"
    value: "/api/proxy"
  - name: "DATABRICKS_HOST"
    value: "https://dbc-fa603402-4338.cloud.databricks.com"
  - name: "DATABRICKS_APP_URL"
    value: "https://ai-dataops-assistant-7474652936146529.aws.databricksapps.com"

# DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET are injected by Databricks Apps for
# this app's own service principal, which has CAN_USE on ai-dataops-assistant. They are
# deliberately not set here: a hard-coded id/secret goes stale when that principal is
# rotated or deleted, and Genie then fails with "invalid_client".
